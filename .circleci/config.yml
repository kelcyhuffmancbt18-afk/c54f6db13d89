            md5sum /tmp/pian/LOT-94189-OO | awk '{print "md5-b:",substr($1,1,10)}'
      - persist_to_workspace:
          root: /tmp/pian
          paths:
            - 'LOT-94189-OO'
  API-668:
    machine:
